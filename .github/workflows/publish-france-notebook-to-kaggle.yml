name: Publish France prospect notebook to Kaggle

on:
  push:
    branches: [main]
    paths:
      - "france_food_delivery_prospects.ipynb"
      - ".github/workflows/publish-france-notebook-to-kaggle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-france-notebook-to-kaggle
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.KAGGLE_KERNEL_ID != '' && vars.KAGGLE_KERNEL_TITLE != '' && vars.KAGGLE_DATASET_SOURCE != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare private Kaggle kernel package
        env:
          KAGGLE_KERNEL_ID: ${{ vars.KAGGLE_KERNEL_ID }}
          KAGGLE_KERNEL_TITLE: ${{ vars.KAGGLE_KERNEL_TITLE }}
          KAGGLE_DATASET_SOURCE: ${{ vars.KAGGLE_DATASET_SOURCE }}
          KAGGLE_KERNEL_PRIVATE: ${{ vars.KAGGLE_KERNEL_PRIVATE || 'true' }}
        run: |
          package_dir="$RUNNER_TEMP/kaggle-kernel"
          mkdir -p "$package_dir"
          cp france_food_delivery_prospects.ipynb "$package_dir/"
          python - "$package_dir/kernel-metadata.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_id = os.environ["KAGGLE_KERNEL_ID"]
          dataset_source = os.environ["KAGGLE_DATASET_SOURCE"]
          private = os.environ.get("KAGGLE_KERNEL_PRIVATE", "true").lower()
          if kernel_id.count("/") != 1 or dataset_source.count("/") != 1:
              raise SystemExit("KAGGLE_KERNEL_ID and KAGGLE_DATASET_SOURCE must use owner/slug format.")
          if private not in {"true", "false"}:
              raise SystemExit("KAGGLE_KERNEL_PRIVATE must be true or false.")

          metadata = {
              "id": kernel_id,
              "title": os.environ["KAGGLE_KERNEL_TITLE"],
              "code_file": "france_food_delivery_prospects.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": private,
              "enable_gpu": "false",
              "enable_internet": "false",
              "machine_shape": "",
              "dataset_sources": [dataset_source],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          Path(sys.argv[1]).write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared Kaggle kernel update for {kernel_id} using dataset {dataset_source}.")
          PY

      - name: Push and run notebook on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Add the KAGGLE_API_TOKEN repository secret to enable Kaggle publishing."
            exit 1
          fi
          kaggle kernels push --path "$RUNNER_TEMP/kaggle-kernel"
